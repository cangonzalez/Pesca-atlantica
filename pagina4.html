<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Contacto | Pescatlantica</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <img src="imagenes/logo.jpeg" alt="Logo Pescatlantica" class="logo">
    </header>

    <!-- NAV -->
    <nav class="nav">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="pagina2.html">Nosotros</a></li>
            <li><a href="pagina3.html">Productos</a></li>
            <li><a href="pagina4.html" class="active">Contacto</a></li>
        </ul>
    </nav>

    <main>

        <section class="contacto-intro">
            <h2>Contacto</h2>
            <p>
                Consultanos por compras mayoristas, pedidos especiales
                o información sobre exportaciones.
            </p>
        </section>

        <section class="grid">

            <!-- INFO -->
            <div class="card">
                <h3>Información</h3>

                <p>📍 Mar del Plata, Argentina</p>
                <p>📞 +54 11 1111-1111</p>
                <p>✉ contacto@pescatlantica.com</p>
            </div>

            <!-- FORM -->
            <div class="card">
                <h3>Formulario</h3>

                <form class="form-contacto">

                    <input 
                        type="text" 
                        placeholder="Nombre completo"
                        required
                    >

                    <input 
                        type="email" 
                        placeholder="Correo electrónico"
                        required
                    >

                    <textarea 
                        placeholder="Escribí tu mensaje..."
                        required
                    ></textarea>

                    <button class="btn" type="submit">
                        Enviar consulta
                    </button>

                </form>
            </div>

        </section>

    </main>

    <footer class="footer">
        <p>© 2026 Pescatlantica</p>
    </footer>

</body>
</html>
